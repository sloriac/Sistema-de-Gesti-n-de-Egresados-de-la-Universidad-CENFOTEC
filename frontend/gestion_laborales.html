<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Oportunidades Laborales</title>

    <link rel="stylesheet" href="./css/oportunidades_laborales.css">
</head>
<body>

    <!-- Gestión de Oportunidades Laborales -->

    <header>
        <h1>Gestión de Oportunidades Laborales</h1>

        <p class="subtitulo">
            Complete la información para registrar una oportunidad laboral.
        </p>
    </header>

    <nav>
        <p>Registro de oportunidades laborales</p>
    </nav>

    <main>

        <section>

            <article>

                <form id="formOportunidad" novalidate>

                    <!-- Empresa -->
                    <div>
                        <label for="empresa">Empresa</label>
                        <span class="label-requerido">*</span>

                        <div>
                            <input type="text" id="empresa" required>
                        </div>
                    </div>

                    <!-- Puesto -->
                    <div>
                        <label for="puesto">Puesto</label>
                        <span class="label-requerido">*</span>

                        <div>
                            <input type="text" id="puesto" required>
                        </div>
                    </div>

                    <!-- Descripción -->
                    <div>
                        <label for="descripcionTrabajo">Descripción</label>
                        <span class="label-requerido">*</span>

                        <div>
                            <textarea
                                id="descripcionTrabajo"
                                minlength="20"
                                required></textarea>
                        </div>
                    </div>

                    <!-- Área profesional -->
                    <div>
                        <label for="area">Área profesional</label>
                        <span class="label-requerido">*</span>

                        <div>
                            <select id="area" required>
                                <option value="">Seleccione una opción</option>
                                <option>Desarrollo de Software</option>
                                <option>Diseño Web</option>
                                <option>Bases de Datos</option>
                                <option>Redes</option>
                            </select>
                        </div>
                    </div>

                    <!-- Modalidad -->
                    <div>
                        <label for="modalidadTrabajo">Modalidad</label>
                        <span class="label-requerido">*</span>

                        <div>
                           <select id="modalidadTrabajo">
                            <option value="">Seleccione una opción</option>
                            <option value="Remoto">Remoto</option>
                            <option value="Hibrido">Híbrido</option>
                            <option value="Presencial">Presencial</option>
                        </select>
                        </div>
                    </div>

                    <!-- Ubicación -->
                    <div>
                        <label for="ubicacionTrabajo">Ubicación</label>
                        <span class="label-requerido">*</span>

                        <div>
                            <input type="text" id="ubicacionTrabajo" required>
                        </div>
                    </div>

                    <!-- Fecha publicación -->
                    <div>
                        <label for="fechaPublicacion">
                            Fecha de publicación
                        </label>
                        <span class="label-requerido">*</span>

                        <div>
                            <input
                                type="date"
                                id="fechaPublicacion"
                                required>
                        </div>
                    </div>

                    <!-- Fecha vencimiento -->
                    <div>
                        <label for="fechaVencimiento">
                            Fecha de vencimiento
                        </label>
                        <span class="label-requerido">*</span>

                        <div>
                            <input
                                type="date"
                                id="fechaVencimiento"
                                required>
                        </div>
                    </div>

                    <!-- Contacto -->
                    <div>
                        <label for="contacto">
                            Correo o enlace de contacto
                        </label>
                        <span class="label-requerido">*</span>

                        <div>
                            <input
                                type="email"
                                id="contacto"
                                required>
                        </div>
                    </div>

                    <!-- Estado -->
                    <div>
                        <label for="estadoTrabajo">Estado</label>
                        <span class="label-requerido">*</span>

                        <div>
                            <select id="estadoTrabajo" required>
                                <option value="">Seleccione una opción</option>
                                <option>Activa</option>
                                <option>Cerrada</option>
                                <option>En revisión</option>
                            </select>
                        </div>
                    </div>

                    <button
                        type="submit"
                        id="guardarOportunidad"
                        class="guardar-formulario">

                        Publicar oportunidad

                    </button>

                </form>

            </article>

        </section>

    </main>

    <footer>
        <p>Universidad CENFOTEC Diseño y Programación Web</p>
    </footer>

    <script src="./js/gestion_laborales.js"></script>

</body>

</html>
